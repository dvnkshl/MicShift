name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test and lint
        run: ./Scripts/check.sh
      - name: Build release app
        run: ./Scripts/build-app.sh
      - name: Verify bundle
        run: |
          test -x "build/MicShift.app/Contents/MacOS/MicShift"
          test -x "build/MicShift.app/Contents/Resources/dji-link-monitor"
          test -f "build/MicShift.app/Contents/Resources/MicShift.icns"
          codesign --verify --deep --strict --verbose=2 "build/MicShift.app"
